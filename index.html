<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IATA Lernen">
<meta name="theme-color" content="#f3f5f8">
<title>IATA Lernkarten</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f8;color:#111}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.app{width:100%;max-width:650px}
.header{text-align:center;margin-bottom:18px}
.header h1{margin:0 0 10px;font-size:30px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:14px;color:#555}
.card{background:#fff;border-radius:22px;padding:30px 22px;box-shadow:0 10px 35px rgba(0,0,0,.12);text-align:center}
.country{font-size:18px;color:#666;margin-bottom:12px;font-weight:700}
.label{color:#777;font-size:14px;margin-bottom:8px}
.airport-name{font-size:30px;font-weight:800;min-height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
input{width:100%;max-width:260px;font-size:28px;text-align:center;text-transform:uppercase;letter-spacing:10px;padding:14px;border-radius:12px;border:2px solid #ccc;outline:none;background:#fff;color:#111}
input:focus{border-color:#111}
.buttons{margin-top:20px;display:grid;grid-template-columns:1fr;gap:12px}
button{border:none;border-radius:14px;padding:15px 18px;font-size:17px;cursor:pointer;font-weight:800;min-height:52px}
#checkButton{background:#111;color:#fff}
#dontKnowButton{background:#ececec;color:#111}
#nextButton{background:#dfe7ff;color:#111;display:none}
#restartButton{background:#111;color:#fff;width:100%}
.feedback{min-height:74px;margin-top:20px;font-size:21px;font-weight:800}
.correct{color:#178c3b} .wrong{color:#c62828} .unknown{color:#d17a00}
.answer{margin-top:8px;font-size:17px;font-weight:500;color:#333}
.solution-code{display:inline-block;margin-top:6px;font-size:30px;font-weight:900;letter-spacing:6px}
.progress-container{margin-top:20px;height:10px;background:#ddd;border-radius:99px;overflow:hidden}
.progress{height:100%;width:0;background:#222;transition:width .25s ease}
.result-screen{display:none}
.result-screen h2{font-size:30px;margin-top:0}
.big-result{font-size:50px;font-weight:900;margin:18px 0}
@media(min-width:520px){.buttons{grid-template-columns:1fr 1fr}#nextButton{grid-column:1/-1}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<body>
<div class="app">
  <div class="header">
    <h1>✈️ IATA Lernkarten</h1>
    <div class="stats">
      <span id="counter">Karte 1 / 168</span>
      <span>✅ Richtig: <strong id="correctCount">0</strong></span>
      <span>❌ Falsch: <strong id="wrongCount">0</strong></span>
    </div>
  </div>

  <div class="card" id="quizCard">
    <div class="country" id="country"></div>
    <div class="label">Welcher IATA-Code gehört zu diesem Flughafen?</div>
    <div class="airport-name" id="airportName">Flughafen</div>
    <input type="text" id="iataInput" maxlength="3" autocomplete="off" autocorrect="off" spellcheck="false"
           autocapitalize="characters" inputmode="text" placeholder="---">
    <div class="buttons">
      <button id="checkButton">Prüfen</button>
      <button id="dontKnowButton">Ich weiß es nicht</button>
      <button id="nextButton">Nächste Karte →</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="progress-container"><div class="progress" id="progress"></div></div>
  </div>

  <div class="card result-screen" id="resultScreen">
    <h2>Training beendet 🎉</h2>
    <div class="big-result" id="finalScore"></div>
    <p id="finalText"></p>
    <button id="restartButton">Neu starten</button>
  </div>
</div>

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

let quizAirports=shuffle([...airports]);
let currentIndex=0, correct=0, wrong=0, answered=false;

const airportName=document.getElementById("airportName");
const country=document.getElementById("country");
const input=document.getElementById("iataInput");
const checkButton=document.getElementById("checkButton");
const dontKnowButton=document.getElementById("dontKnowButton");
const nextButton=document.getElementById("nextButton");
const feedback=document.getElementById("feedback");
const counter=document.getElementById("counter");
const correctCount=document.getElementById("correctCount");
const wrongCount=document.getElementById("wrongCount");
const progress=document.getElementById("progress");
const quizCard=document.getElementById("quizCard");
const resultScreen=document.getElementById("resultScreen");

function showCard(){
  answered=false;
  const airport=quizAirports[currentIndex];
  airportName.textContent=airport.name;
  country.textContent=airport.country;
  input.value="";
  input.disabled=false;
  feedback.innerHTML="";
  feedback.className="feedback";
  checkButton.style.display="block";
  dontKnowButton.style.display="block";
  nextButton.style.display="none";
  counter.textContent=`Karte ${currentIndex+1} / ${quizAirports.length}`;
  progress.style.width=`${(currentIndex/quizAirports.length)*100}%`;
  setTimeout(()=>input.focus(),150);
}

function revealResult(kind, correctAnswer){
  if(kind==="correct"){
    feedback.innerHTML="✅ Richtig!";
    feedback.className="feedback correct";
  } else if(kind==="wrong"){
    feedback.innerHTML=`❌ Falsch<div class="answer">Richtiger Code:<div class="solution-code">${correctAnswer}</div></div>`;
    feedback.className="feedback wrong";
  } else {
    feedback.innerHTML=`🤷 Nicht gewusst<div class="answer">Richtiger Code:<div class="solution-code">${correctAnswer}</div></div>`;
    feedback.className="feedback unknown";
  }
  correctCount.textContent=correct;
  wrongCount.textContent=wrong;
  input.disabled=true;
  checkButton.style.display="none";
  dontKnowButton.style.display="none";
  nextButton.style.display="block";
}

function checkAnswer(){
  if(answered)return;
  const userAnswer=input.value.trim().toUpperCase();
  if(userAnswer.length!==3){
    feedback.textContent="Bitte einen 3-stelligen IATA-Code eingeben.";
    feedback.className="feedback wrong";
    return;
  }
  answered=true;
  const correctAnswer=quizAirports[currentIndex].code;
  if(userAnswer===correctAnswer){correct++;revealResult("correct",correctAnswer);}
  else{wrong++;revealResult("wrong",correctAnswer);}
}

function dontKnowAnswer(){
  if(answered)return;
  answered=true;
  wrong++;
  revealResult("unknown",quizAirports[currentIndex].code);
}

function nextCard(){
  currentIndex++;
  if(currentIndex>=quizAirports.length) finishQuiz();
  else showCard();
}

function finishQuiz(){
  quizCard.style.display="none";
  resultScreen.style.display="block";
  const percent=Math.round((correct/quizAirports.length)*100);
  document.getElementById("finalScore").textContent=`${percent}%`;
  document.getElementById("finalText").innerHTML=`✅ ${correct} richtig<br><br>❌ ${wrong} falsch / nicht gewusst<br><br>📚 ${quizAirports.length} Karten insgesamt`;
}

function restartQuiz(){
  quizAirports=shuffle([...airports]);
  currentIndex=0;correct=0;wrong=0;answered=false;
  correctCount.textContent="0";wrongCount.textContent="0";
  resultScreen.style.display="none";quizCard.style.display="block";
  showCard();
}

checkButton.addEventListener("click",checkAnswer);
dontKnowButton.addEventListener("click",dontKnowAnswer);
nextButton.addEventListener("click",nextCard);
document.getElementById("restartButton").addEventListener("click",restartQuiz);

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ if(!answered) checkAnswer(); else nextCard(); }
});
input.addEventListener("input",function(){
  this.value=this.value.replace(/[^a-zA-Z]/g,"").toUpperCase().slice(0,3);
});

showCard();
</script>

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
