html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(#dcefff,#f8fbff);color:var(--t)}
body{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.app{max-width:700px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.brand{font-size:24px;font-weight:900;color:var(--b)}
.offline{background:#fff;border:1px solid #d8e4ef;padding:7px 10px;border-radius:99px;font-size:12px;color:var(--m)}
.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 38px #16314c1c}.hero{text-align:center;padding:32px 20px}.hero .plane{font-size:58px}.hero h1{margin:8px 0 5px;font-size:34px}.muted{color:var(--m)}
h2{margin:0 0 16px}.sect{margin:20px 0 9px;font-size:13px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
button{width:100%;border:0;border-radius:15px;padding:15px;font:inherit;font-weight:800;cursor:pointer;min-height:52px}.primary{background:linear-gradient(var(--b2),var(--b));color:#fff}.secondary{background:#e8f3ff;color:var(--b)}.ghost{background:#f0f4f7;color:var(--t)}
.grid{display:grid;gap:11px}.option{display:flex;align-items:center;gap:12px;border:2px solid #dce7f1;border-radius:15px;padding:13px;background:#fff}.option input{width:20px;height:20px}
.countries{display:grid;gap:8px;max-height:46vh;overflow:auto}.country{border:2px solid #e0eaf2;border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:10px;background:#fff}.country.sel{border-color:var(--b2);background:#eef7ff}.count{font-size:12px;color:var(--m)}
.qhead{display:flex;justify-content:space-between;align-items:center}.mini{width:auto;min-height:0;padding:9px 12px}.progressBox{height:10px;background:#dce6ee;border-radius:99px;overflow:hidden;margin:13px 0 18px}.progress{height:100%;background:var(--b2);width:0}
.ctag{text-align:center;color:var(--b);font-weight:800}.qlabel{text-align:center;color:var(--m);font-size:14px;margin:10px 0 0}.qmain{min-height:90px;display:flex;justify-content:center;align-items:center;text-align:center;font-size:32px;font-weight:900}
.code{display:block;width:100%;max-width:280px;margin:auto;border:2px solid #cdd9e4;border-radius:15px;padding:14px;font-size:30px;text-align:center;letter-spacing:10px;text-transform:uppercase;outline:none}.code:focus{border-color:var(--b2)}

<body>
<div class="app">
<div class="top"><div class="brand">✈️ IATA Lernen</div><div class="offline">Offline-App</div></div>

<section id="menu" class="screen active">
  <div class="card hero"><div class="plane">✈️</div><h1>IATA Lernkarten</h1><div class="muted">Länder einzeln oder gemischt lernen.</div></div>
  <div class="card" style="margin-top:14px"><div class="grid">
    <button class="primary" id="setupBtn">Lernen starten</button>
    <button class="secondary" id="quickBtn">Alle Länder – Flughafen → Code</button>
  </div></div>
</section>

<section id="setup" class="screen">
<div class="card">
<h2>Lernmodus</h2>
<div class="sect">Länderauswahl</div>
<label class="option"><input type="radio" name="scope" value="all" checked><div><b>Alle Länder gemischt</b><div class="muted">Alle 168 Lernkarten</div></div></label>
<label class="option" style="margin-top:9px"><input type="radio" name="scope" value="one"><div><b>Ein Land separat</b><div class="muted">Nur Flughäfen des gewählten Landes</div></div></label>
<div id="picker" style="display:none"><div class="sect">Land auswählen</div><div id="countryList" class="countries"></div></div>
<div class="sect">Abfragerichtung</div>
<label class="option"><input type="radio" name="mode" value="airport" checked><div><b>Flughafen anzeigen → Code eingeben</b></div></label>
<label class="option" style="margin-top:9px"><input type="radio" name="mode" value="code"><div><b>Code anzeigen → Flughafen auswählen</b><div class="muted">3 Antworten, richtige Position zufällig</div></div></label>
<div class="actions"><button class="primary" id="goBtn">Jetzt starten</button><button class="ghost" id="backBtn">Zurück</button></div>
</div>
</section>

<section id="quiz" class="screen"><div class="card">
<div class="qhead"><button class="ghost mini" id="quitBtn">← Menü</button><b id="counter"></b></div>
<div class="progressBox"><div id="progress" class="progress"></div></div>
<div id="ctag" class="ctag"></div><div id="qlabel" class="qlabel"></div><div id="qmain" class="qmain"></div>

<div id="typing">
<input id="codeInput" class="code" maxlength="3" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="---">
<div class="actions"><button class="primary" id="checkBtn">Prüfen</button><button class="ghost" id="dkBtn">Ich weiß es nicht</button></div>
</div>

<div id="multiple" style="display:none"><div id="answerList" class="answers"></div><div class="actions"><button class="ghost" id="dk2Btn">Ich weiß es nicht</button></div></div>
<div id="feedback" class="feedback"></div>
<div class="actions"><button class="secondary" id="nextBtn" style="display:none">Nächste Karte →</button></div>
<div class="stats"><div class="stat"><b id="right">0</b><span>Richtig</span></div><div class="stat"><b id="wrong">0</b><span>Falsch</span></div><div class="stat"><b id="left">0</b><span>Übrig</span></div></div>
</div></section>

<section id="result" class="screen"><div class="card result">
<h2>Training beendet 🎉</h2><div id="score" class="score"></div><div id="resultText"></div>
<div class="actions"><button class="primary" id="againBtn">Nochmal</button><button class="ghost" id="homeBtn">Zum Menü</button></div>
</div></section>
</div>

document.querySelectorAll('input[name="scope"]').forEach(r=>r.onchange=e=>document.getElementById("picker").style.display=e.target.value==="one"?"block":"none");

function getSettings(){settings.scope=document.querySelector('input[name="scope"]:checked').value;settings.mode=document.querySelector('input[name="mode"]:checked').value}
function start(quick=false){
 if(quick) settings={scope:"all",mode:"airport"}; else getSettings();
 quiz=shuffle(settings.scope==="one"?airports.filter(a=>a.country===selected):airports);idx=0;right=0;wrong=0;show("quiz");render();
}
function render(){
 answered=false;const a=quiz[idx];
 counter.textContent=`${idx+1} / ${quiz.length}`;progress.style.width=`${idx/quiz.length*100}%`;ctag.textContent=a.country;feedback.innerHTML="";nextBtn.style.display="none";rightEl.textContent=right;wrongEl.textContent=wrong;left.textContent=quiz.length-idx-1;
 if(settings.mode==="airport"){
   qlabel.textContent="Welcher IATA-Code gehört zu diesem Flughafen?";qmain.textContent=a.name;typing.style.display="block";multiple.style.display="none";codeInput.value="";codeInput.disabled=false;checkBtn.style.display="block";dkBtn.style.display="block";setTimeout(()=>codeInput.focus(),120);
 } else {
   qlabel.textContent="Welcher Flughafen gehört zu diesem IATA-Code?";qmain.textContent=a.code;typing.style.display="none";multiple.style.display="block";dk2Btn.style.display="block";makeChoices(a);
 }
}
const counter=document.getElementById("counter"),progress=document.getElementById("progress"),ctag=document.getElementById("ctag"),qlabel=document.getElementById("qlabel"),qmain=document.getElementById("qmain"),typing=document.getElementById("typing"),multiple=document.getElementById("multiple"),codeInput=document.getElementById("codeInput"),checkBtn=document.getElementById("checkBtn"),dkBtn=document.getElementById("dkBtn"),dk2Btn=document.getElementById("dk2Btn"),feedback=document.getElementById("feedback"),nextBtn=document.getElementById("nextBtn"),rightEl=document.getElementById("right"),wrongEl=document.getElementById("wrong"),left=document.getElementById("left");

function finishAnswer(){rightEl.textContent=right;wrongEl.textContent=wrong;checkBtn.style.display="none";dkBtn.style.display="none";dk2Btn.style.display="none";nextBtn.style.display="block"}
function check(){if(answered)return;let v=codeInput.value.trim().toUpperCase();if(v.length!==3){feedback.textContent="Bitte 3 Buchstaben eingeben.";return}answered=true;codeInput.disabled=true;let a=quiz[idx];if(v===a.code){right++;feedback.innerHTML="✅ Richtig!"}else{wrong++;feedback.innerHTML=`❌ Falsch<small>Richtig ist: <b>${a.code}</b></small>`}finishAnswer()}
function dontKnow(){if(answered)return;answered=true;wrong++;let a=quiz[idx];feedback.innerHTML=settings.mode==="airport"?`🤷 Nicht gewusst<small>Richtig ist: <b>${a.code}</b></small>`:`🤷 Nicht gewusst<small>Richtig ist: <b>${a.name}</b></small>`;if(settings.mode==="airport")codeInput.disabled=true;else document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.dataset.code===a.code)b.classList.add("ok")});finishAnswer()}
function makeChoices(correct){
 let pool=airports.filter(x=>x.country===correct.country&&x.code!==correct.code),wrongOnes=shuffle(pool).slice(0,2);
 if(wrongOnes.length<2){let used=new Set(wrongOnes.map(x=>x.code));wrongOnes=wrongOnes.concat(shuffle(airports.filter(x=>x.code!==correct.code&&!used.has(x.code))).slice(0,2-wrongOnes.length))}
 let list=shuffle([correct,...wrongOnes]),box=document.getElementById("answerList");box.innerHTML="";
 list.forEach(x=>{let b=document.createElement("button");b.className="answer";b.textContent=x.name;b.dataset.code=x.code;b.onclick=()=>choose(b,correct);box.appendChild(b)})
}
function choose(btn,correct){if(answered)return;answered=true;let bs=[...document.querySelectorAll(".answer")];bs.forEach(b=>b.disabled=true);if(btn.dataset.code===correct.code){right++;btn.classList.add("ok");feedback.innerHTML="✅ Richtig!"}else{wrong++;btn.classList.add("no");bs.find(b=>b.dataset.code===correct.code)?.classList.add("ok");feedback.innerHTML=`❌ Falsch<small>Richtig ist: <b>${correct.name}</b></small>`}finishAnswer()}
function next(){idx++;if(idx>=quiz.length){show("result");let p=Math.round(right/quiz.length*100);score.textContent=p+"%";resultText.innerHTML=`<b>${right}</b> richtig • <b>${wrong}</b> falsch<br><span class="muted">${quiz.length} Karten</span>`}else render()}

setupBtn.onclick=()=>show("setup");quickBtn.onclick=()=>start(true);backBtn.onclick=()=>show("menu");goBtn.onclick=()=>start(false);quitBtn.onclick=()=>show("menu");checkBtn.onclick=check;dkBtn.onclick=dontKnow;dk2Btn.onclick=dontKnow;nextBtn.onclick=next;againBtn.onclick=()=>{quiz=shuffle(quiz);idx=0;right=0;wrong=0;show("quiz");render()};homeBtn.onclick=()=>show("menu");
codeInput.oninput=function(){this.value=this.value.replace(/[^a-zA-Z]/g,"").toUpperCase().slice(0,3)};codeInput.onkeydown=e=>{if(e.key==="Enter"){answered?next():check()}};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
</script>
</body></html>
